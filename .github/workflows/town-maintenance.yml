name: town-maintenance

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 */2 * *" # every 48 hours (every 2 days)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: town-automation
  cancel-in-progress: false

jobs:
  maintenance:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip-town]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install tooling deps
        run: python -m pip install -r tools/requirements.txt

      - name: Lint
        run: python tools/townctl.py lint

      - name: Rebuild catalogs
        run: python tools/townctl.py index

      - name: Export site (optional)
        run: python tools/townctl.py export-site

      - name: Commit changes (if any)
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[skip-town] Auto-update catalogs"
          git push
